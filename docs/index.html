<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direcções da Semana — Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E8E3;--card:#FFFFFF;--ink:#16223A;--muted:#5B6677;--line:#C9D1CB;
  --floor:#CFD6CE;--wall:#2B3A55;--room:#E9ECE6;
  --fontes:#1F8A7E;--analise:#C98E1E;--design:#B8457A;--editor:#3F4FA3;--voce:#16223A;
  --ok:#1F8A7E;--warn:#C98E1E;--err:#B23A2E;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524;--card:#16203A;--ink:#E7ECEA;--muted:#9AA6B5;--line:#2A3754;
  --floor:#1B2638;--wall:#0A101C;--room:#233049;}}
:root[data-theme="dark"]{--bg:#0E1524;--card:#16203A;--ink:#E7ECEA;--muted:#9AA6B5;--line:#2A3754;--floor:#1B2638;--wall:#0A101C;--room:#233049}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
:focus-visible{outline:3px solid var(--analise);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:clamp(1.6rem,6vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.clock{font-size:.9rem;color:var(--muted);text-align:right}
.clock strong{display:block;color:var(--ink);font-size:1.05rem}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.office{background:var(--wall);border-radius:22px;padding:10px}
.office svg{width:100%;height:auto;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:1.15rem}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.log li{padding:8px 0;border-top:1px solid var(--line);font-size:.92rem;display:grid;grid-template-columns:12px 1fr;gap:8px}
.log li:first-child{border-top:0}
.log .d{width:10px;height:10px;border-radius:50%;margin-top:6px}
.log time{color:var(--muted);font-size:.8rem;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.txt{font-family:var(--serif);font-size:1.02rem;line-height:1.6;white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;max-height:460px;overflow:auto}
.btn{display:inline-block;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none}
.btn.gold{background:var(--analise);color:#1b1404}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.slides{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.slide{flex:0 0 200px;aspect-ratio:1/1;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:var(--voce);color:#F1F4F2;scroll-snap-align:start}
.slide.alerta{background:var(--err)}.slide.oportunidade{background:var(--fontes)}
.slide .h{font-weight:800;font-size:1.1rem;line-height:1.1}.slide .b{font-family:var(--serif);font-size:.93rem;line-height:1.35;margin-top:6px}
.slide .top{display:flex;justify-content:space-between;font-size:.75rem;opacity:.8}.slide .em{font-size:1.5rem}
.duv{border-left:4px solid var(--analise);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:0 10px 10px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok);color:#fff}.pill.wait{background:var(--analise);color:#1b1404}
.demo{background:var(--analise);color:#1b1404;padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:.9rem}
.hidden{display:none!important}
/* animações do escritório */
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes type{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{50%{opacity:.55}}
.working .head{animation:bob .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.working .dots circle{animation:type 1s infinite}
.working .dots circle:nth-child(2){animation-delay:.2s}.working .dots circle:nth-child(3){animation-delay:.4s}
.working .screen{animation:glow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.working .head,.working .dots circle,.working .screen,.paper{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="demoNote" class="demo hidden">Modo demonstração: ainda não há dados da redacção. Depois da primeira ronda, o escritório mostra o trabalho real.</div>
  <header>
    <div>
      <h1>Direcções da Semana</h1>
      <p class="sub" id="sub">A carregar o escritório…</p>
    </div>
    <div class="clock"><strong id="next">—</strong><span id="upd"></span></div>
  </header>

  <div class="layout">
    <div>
      <div class="office"><svg id="floor" viewBox="0 0 360 500" role="img" aria-label="Escritório visto de cima com os agentes da redacção"></svg></div>
    </div>
    <div>
      <div class="card" id="approval">
        <h2>A sua mesa</h2>
        <div id="apState" class="sub">—</div>
        <div id="duvidas"></div>
        <div class="row"><a class="btn gold" id="issueBtn" href="#" target="_blank" rel="noopener">Responder, rever ou aprovar</a></div>
      </div>
      <div class="card"><h2>O que a equipa está a fazer</h2><ul class="log" id="log"></ul></div>
    </div>
  </div>

  <div class="card">
    <h2>Edição actual</h2>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="whatsapp" aria-selected="true">WhatsApp</button>
      <button role="tab" data-t="instagram" aria-selected="false">Instagram</button>
      <button role="tab" data-t="linkedin" aria-selected="false">LinkedIn</button>
      <button role="tab" data-t="completa" aria-selected="false">Análise completa</button>
      <button role="tab" data-t="analise" aria-selected="false">Quem ganha/perde</button>
      <button role="tab" data-t="fontes" aria-selected="false">Fontes</button>
    </div>
    <div id="slidesWrap" class="hidden"><div class="slides" id="slides"></div></div>
    <div class="txt" id="txt">Ainda sem edição.</div>
    <div class="row"><button class="btn" id="copy">Copiar texto</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NS="http://www.w3.org/2000/svg";
const AG={
  fontes:{nome:"Fontes",cor:"var(--fontes)",x:10,y:10},
  analise:{nome:"Análise",cor:"var(--analise)",x:190,y:10},
  design:{nome:"Design",cor:"var(--design)",x:10,y:175},
  editor:{nome:"Editor",cor:"var(--editor)",x:190,y:175}
};
const COR_ESTADO={"a trabalhar":"var(--warn)","pronto":"var(--ok)","erro":"var(--err)","à espera":"var(--warn)","aprovado":"var(--ok)","parado":"#8894A6"};
let status=null,edicao=null,tab="whatsapp",demo=false;

/* ---------- Escritório (SVG) ---------- */
function pessoa(cx,cy,cor,rot){
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})">
    <ellipse cx="0" cy="4" rx="15" ry="9" fill="${cor}"/>
    <circle class="head" cx="0" cy="-2" r="7.5" fill="#5B3A24"/>
    <path d="M-7 -4 a7.5 7.5 0 0 1 14 0 z" fill="#1d130c"/>
  </g>`;
}
function sala(k,a,st){
  const w=160,h=150,{x,y}=a,trab=st.estado==="a trabalhar";
  let props="";
  if(k==="fontes")props=`<rect x="${x+12}" y="${y+100}" width="28" height="36" rx="3" fill="#B9A98A"/><rect x="${x+16}" y="${y+104}" width="20" height="4" fill="#fff" opacity=".7"/><rect x="${x+16}" y="${y+112}" width="20" height="4" fill="#fff" opacity=".7"/><circle cx="${x+132}" cy="${y+118}" r="14" fill="none" stroke="${a.cor}" stroke-width="3"/><path d="M${x+118} ${y+118}h28M${x+132} ${y+104}v28" stroke="${a.cor}" stroke-width="1.5"/>`;
  if(k==="analise")props=`<rect x="${x+14}" y="${y+104}" width="60" height="34" rx="3" fill="#fff" stroke="#9aa" /><polyline points="${x+20},${y+130} ${x+34},${y+118} ${x+46},${y+124} ${x+66},${y+110}" fill="none" stroke="${a.cor}" stroke-width="2.5"/>`;
  if(k==="design")props=`<rect x="${x+14}" y="${y+104}" width="30" height="30" rx="4" fill="var(--design)"/><rect x="${x+48}" y="${y+104}" width="30" height="30" rx="4" fill="var(--fontes)"/><rect x="${x+82}" y="${y+104}" width="30" height="30" rx="4" fill="var(--voce)"/>`;
  if(k==="editor")props=`<rect x="${x+16}" y="${y+104}" width="26" height="32" rx="2" fill="#fff" transform="rotate(-8 ${x+29} ${y+120})"/><rect x="${x+30}" y="${y+106}" width="26" height="32" rx="2" fill="#fff" stroke="#bbb"/><rect x="${x+34}" y="${y+112}" width="18" height="2.5" fill="${a.cor}"/><rect x="${x+34}" y="${y+118}" width="14" height="2.5" fill="#999"/>`;
  const badge=st.estado==="pronto"?`<circle cx="${x+w-16}" cy="${y+16}" r="10" fill="var(--ok)"/><path d="M${x+w-21} ${y+16} l4 4 l7 -8" stroke="#fff" stroke-width="2.5" fill="none"/>`
    :st.estado==="erro"?`<circle cx="${x+w-16}" cy="${y+16}" r="10" fill="var(--err)"/><text x="${x+w-16}" y="${y+21}" text-anchor="middle" font-weight="800" fill="#fff" font-size="14">!</text>`:"";
  return `<g class="${trab?"working":""}">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--room)"/>
    <rect x="${x}" y="${y}" width="${w}" height="5" rx="2" fill="${a.cor}"/>
    <text x="${x+12}" y="${y+24}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="14" fill="var(--wall)">${a.nome}</text>
    <text x="${x+12}" y="${y+39}" font-family="Bricolage Grotesque, sans-serif" font-size="10.5" fill="${COR_ESTADO[st.estado]||"#8894A6"}" font-weight="600">${esc(st.estado||"parado")}</text>
    <rect x="${x+40}" y="${y+48}" width="80" height="26" rx="4" fill="#8A6A45"/>
    <rect class="screen" x="${x+64}" y="${y+51}" width="32" height="6" rx="1.5" fill="${trab?"#9FE3D9":"#3a4a5e"}"/>
    <rect x="${x+56}" y="${y+62}" width="48" height="8" rx="2" fill="#6d5236"/>
    ${pessoa(x+80,y+86,a.cor,0)}
    ${trab?`<g class="dots"><circle cx="${x+102}" cy="${y+80}" r="2.4" fill="${a.cor}"/><circle cx="${x+110}" cy="${y+80}" r="2.4" fill="${a.cor}"/><circle cx="${x+118}" cy="${y+80}" r="2.4" fill="${a.cor}"/></g>`:""}
    ${props}${badge}
  </g>`;
}
function capulana(x,y,w,h){
  let d="";for(let i=0;i<w;i+=16)for(let j=0;j<h;j+=16)d+=`<path d="M${x+i+8} ${y+j} l8 8 l-8 8 l-8 -8z" fill="${(i/16+j/16)%2?"var(--analise)":"var(--design)"}" opacity=".85"/>`;
  return `<clipPath id="rug"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/></clipPath><g clip-path="url(#rug)"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--fontes)"/>${d}</g>`;
}
function desenhar(){
  const e=(status&&status.estagios)||{};
  const ap=e.aprovacao||{estado:"parado"};
  let s=`<rect x="0" y="0" width="360" height="500" fill="var(--floor)" rx="14"/>`;
  s+=`<rect x="176" y="10" width="8" height="315" fill="var(--floor)"/>`;
  for(const k in AG)s+=sala(k,AG[k],e[k]||{estado:"parado"});
  // corredor com o papel a circular
  const ativo=Object.keys(AG).find(k=>(e[k]||{}).estado==="a trabalhar");
  if(ativo){const a=AG[ativo];s+=`<rect class="paper" x="${a.x+(a.x<100?150:-6)}" y="${a.y+70}" width="12" height="15" rx="1.5" fill="#fff" stroke="#999"><animate attributeName="y" values="${a.y+60};${a.y+80};${a.y+60}" dur="2s" repeatCount="indefinite"/></rect>`}
  // sala do aprovador
  const y=340,esperar=ap.estado==="à espera",aprov=ap.estado==="aprovado";
  s+=`<rect x="10" y="${y}" width="340" height="150" rx="10" fill="var(--room)"/><rect x="10" y="${y}" width="340" height="5" rx="2" fill="var(--voce)"/>
    <text x="22" y="${y+24}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="14" fill="var(--wall)">A sua sala — aprovação</text>
    <text x="22" y="${y+39}" font-family="Bricolage Grotesque, sans-serif" font-size="10.5" font-weight="600" fill="${COR_ESTADO[ap.estado]||"#8894A6"}">${esc(ap.estado)}</text>
    ${capulana(200,y+48,130,86)}
    <rect x="40" y="${y+60}" width="110" height="34" rx="5" fill="#8A6A45"/>
    ${esperar||aprov?`<rect x="70" y="${y+64}" width="22" height="26" rx="2" fill="#fff" stroke="#bbb"/><rect x="96" y="${y+64}" width="22" height="26" rx="2" fill="#fff" stroke="#bbb"/>`:""}
    <circle cx="95" cy="${y+116}" r="16" fill="none" stroke="var(--voce)" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="95" y="${y+120}" text-anchor="middle" font-size="10" font-family="Bricolage Grotesque, sans-serif" fill="var(--muted)">você</text>`;
  if(esperar)s+=`<g><rect x="126" y="${y+100}" width="62" height="26" rx="13" fill="var(--analise)"/><text x="157" y="${y+117}" text-anchor="middle" font-size="11" font-weight="800" font-family="Bricolage Grotesque, sans-serif" fill="#1b1404">para si</text></g>`;
  if(aprov)s+=`<g><rect x="126" y="${y+100}" width="70" height="26" rx="13" fill="var(--ok)"/><text x="161" y="${y+117}" text-anchor="middle" font-size="11" font-weight="800" font-family="Bricolage Grotesque, sans-serif" fill="#fff">aprovada</text></g>`;
  $("floor").innerHTML=s;
}

/* ---------- Painéis ---------- */
function proxima(){
  const n=new Date(),m=new Date(n.getTime()+2*3600e3);
  const h=m.getUTCHours();
  return h<2?"Próxima ronda: hoje às 2h":"Próxima ronda: amanhã às 2h";
}
function painel(){
  const e=(status&&status.estagios)||{},ap=e.aprovacao||{};
  $("sub").textContent=status?`Semana ${status.semana||"—"}${edicao&&edicao.versao?` — versão ${edicao.versao}`:""}`:"Sem dados ainda";
  $("next").textContent=proxima();
  $("upd").textContent=status&&status.actualizado?"Actualizado "+new Date(status.actualizado).toLocaleString("pt-PT",{weekday:"short",hour:"2-digit",minute:"2-digit"}):"";
  $("apState").innerHTML=ap.estado==="aprovado"?`<span class="pill ok">Aprovada</span> Pronta a publicar.`:ap.estado==="à espera"?`<span class="pill wait">À sua espera</span> ${esc(ap.msg||"")}`:esc(ap.msg||"Sem edição nova ainda.");
  const d=(edicao&&edicao.textos&&edicao.textos.duvidas)||[];
  const fc=(edicao&&edicao.falhas_conformidade)||null;
  $("duvidas").innerHTML=(fc?(fc.length?`<div class="duv"><strong>Direcções em falta:</strong> ${esc(fc.join("; "))}</div>`:`<div class="sub">✅ Todas as direcções editoriais cumpridas</div>`):"")+d.map(x=>`<div class="duv">${esc(x)}</div>`).join("");
  const url=(status&&status.issueUrl)||(edicao&&edicao.issue);
  $("issueBtn").classList.toggle("hidden",!url);if(url)$("issueBtn").href=url;
  const cores={fontes:"var(--fontes)",analise:"var(--analise)",design:"var(--design)",editor:"var(--editor)",aprovacao:"var(--voce)"};
  $("log").innerHTML=((status&&status.log)||[]).map(l=>`<li><span class="d" style="background:${cores[l.agente]||"#888"}"></span><div>${esc(l.msg)}<time>${new Date(l.em).toLocaleString("pt-PT",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</time></div></li>`).join("")||`<li><span></span><div class="sub">A equipa ainda não começou.</div></li>`;
  texto();
}
function texto(){
  const t=(edicao&&edicao.textos)||{};let out="";
  $("slidesWrap").classList.toggle("hidden",tab!=="instagram"||!(edicao&&edicao.design&&edicao.design.slides));
  if(tab==="instagram"&&edicao&&edicao.design){
    const sl=edicao.design.slides||[];
    $("slides").innerHTML=sl.map((s,i)=>`<div class="slide ${esc(s.tom)}"><div class="top"><span class="em">${esc(s.emoji)}</span><span>${i+1}/${sl.length}</span></div><div><div class="h">${esc(s.titulo)}</div><div class="b">${esc(s.texto)}</div></div></div>`).join("");
  }
  if(tab==="whatsapp")out=t.whatsapp;
  if(tab==="instagram")out=(t.instagram||"")+(edicao&&edicao.design&&edicao.design.hashtags?"\n\n"+edicao.design.hashtags.join(" "):"");
  if(tab==="linkedin")out=t.linkedin;
  if(tab==="completa")out=t.analise_completa;
  if(tab==="analise"&&edicao&&edicao.analise){const a=edicao.analise;
    out=`${a.sintese||""}\n\nO que mudou hoje: ${a.o_que_mudou_hoje||"—"}\n\nQUEM GANHA / QUEM PERDE\n`+(a.impacto||[]).map(i=>`${i.efeito==="positivo"?"🟢":i.efeito==="negativo"?"🔴":"🟡"} ${i.grupo}: ${i.explicacao}`).join("\n")+
    `\n\nDIRECÇÃO\n`+(a.direccao||[]).map(d=>`• ${d.publico}: ${d.accao}`).join("\n")+`\n\nSinal a acompanhar: ${a.sinal||"—"}`;}
  if(tab==="fontes"&&edicao)out=(edicao.itens||[]).map(i=>`[${i.ambito==="mundo"?"Mundo":"Moçambique"}] ${i.titulo}\n${i.resumo}\n${i.fonte}${i.url?" — "+i.url:""} (${i.data||""})`).join("\n\n");
  $("txt").textContent=out||"Ainda sem edição.";
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));texto()}));
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("txt").textContent);$("copy").textContent="Copiado"}catch(_){const r=document.createRange();r.selectNodeContents($("txt"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copy").textContent="Seleccionado"}setTimeout(()=>$("copy").textContent="Copiar texto",2000)});

/* ---------- Dados ---------- */
async function carregar(){
  if(demo)return;
  try{
    const t="?t="+Date.now();
    const [s,e]=await Promise.all([fetch("data/status.json"+t).then(r=>r.ok?r.json():null),fetch("data/edicao.json"+t).then(r=>r.ok?r.json():null)]);
    if(!s||!s.estagios||!Object.keys(s.estagios).length)return iniciarDemo();
    status=s;edicao=e;desenhar();painel();
  }catch(_){iniciarDemo()}
}
function iniciarDemo(){
  if(demo)return;demo=true;$("demoNote").classList.remove("hidden");
  const ordem=["fontes","analise","design","editor"],msgs={fontes:"A pesquisar as notícias de hoje…",analise:"A cruzar as notícias e a aprimorar a análise…",design:"A desenhar o carrossel…",editor:"A escrever WhatsApp, Instagram e LinkedIn…"};
  let i=0;
  function passo(){
    const est={};ordem.forEach((k,j)=>est[k]={estado:j<i?"pronto":j===i?"a trabalhar":"parado",msg:msgs[k]});
    est.aprovacao=i>=4?{estado:"à espera",msg:"1 dúvida para si"}:{estado:"parado",msg:"Sem edição nova ainda"};
    status={semana:"demonstração",estagios:est,actualizado:new Date().toISOString(),log:ordem.slice(0,Math.min(i+1,4)).reverse().map(k=>({agente:k,msg:msgs[k],em:new Date().toISOString()}))};
    edicao=i>=4?{versao:1,textos:{whatsapp:"(exemplo) Aqui aparece o texto final do WhatsApp.",duvidas:["Quer destacar mais as notícias de Sofala?"]}}:null;
    desenhar();painel();i=(i+1)%6;
  }
  passo();setInterval(passo,3500);
}
