name: Redacção diária

on:
  schedule:
    # 00:00 UTC = 02:00 em Moçambique (CAT, UTC+2). O GitHub pode atrasar alguns minutos.
    - cron: "0 0 * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: redaccao
  cancel-in-progress: false

jobs:
  redaccao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        (startsWith(github.event.comment.body, '/') || startsWith(github.event.comment.body, 'rever') || startsWith(github.event.comment.body, 'revê') || startsWith(github.event.comment.body, 'refazer') || startsWith(github.event.comment.body, 'trocar') || startsWith(github.event.comment.body, 'incluir') || startsWith(github.event.comment.body, 'aprovad') || startsWith(github.event.comment.body, 'aprovar')) &&
        github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.label.name == 'aprovado')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENTO: ${{ github.event_name }}
      COMENTARIO: ${{ github.event.comment.body }}
      COMENTARIO_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Configurar git
        run: |
          git config user.name "redaccao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1) Sem custo: abre a conversa da semana e junta as suas notícias e sugestões
      - name: Preparar
        id: preparar
        run: node scripts/github.mjs preparar

      # 2) Os agentes — usa a SUA subscrição Claude (sem API paga)
      - name: Agentes (Claude)
        if: steps.preparar.outputs.modo == 'diario' || steps.preparar.outputs.modo == 'rever'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Lê e segue à letra o ficheiro config/instrucoes-agentes.md.
            Modo desta ronda: ${{ steps.preparar.outputs.modo }}.
            Data de hoje (Maputo): ${{ steps.preparar.outputs.hoje }}. Semana: ${{ steps.preparar.outputs.semana }}.
            Post do dia: ${{ steps.preparar.outputs.post_do_dia }}.
          claude_args: >-
            --max-turns 180
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"

      # 3) Sem custo: junta o trabalho dos agentes na edição
      - name: Montar edição
        if: steps.preparar.outputs.modo == 'diario' || steps.preparar.outputs.modo == 'rever'
        run: node scripts/publicar.mjs

      # 4) Sem custo: gera as imagens da edição da semana e do post do dia
      - name: Imagens dos posts
        if: steps.preparar.outputs.modo != 'aprovar'
        continue-on-error: true
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
          node scripts/imagens.mjs || echo "Imagens da semana falharam"
          node scripts/dia.mjs --se-hoje

      # 5) Sem custo: quando aprova a edição da semana, gera o Reel (vídeo 9:16) a partir das stories
      - name: Vídeo (Reel)
        if: (steps.preparar.outputs.modo == 'aprovar' && steps.preparar.outputs.alvo != 'dia') || steps.preparar.outputs.modo == 'editar'
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/video.mjs ${{ steps.preparar.outputs.modo == 'editar' && '--se-aprovada' || '' }}

      # 6) Sem custo: envia-lhe o email (comentário na Issue) ou regista a aprovação
      - name: Notificar
        if: success()
        run: node scripts/github.mjs ${{ steps.preparar.outputs.modo == 'aprovar' && 'aprovar' || 'notificar' }}
      # 7) Sem custo: kits de publicação (uma pasta por rede social + ZIP único) do que foi aprovado
      - name: Kits (semana e dia)
        id: kit
        if: success() && (steps.preparar.outputs.modo == 'aprovar' || steps.preparar.outputs.modo == 'editar')
        continue-on-error: true
        env:
          ALVO: ${{ steps.preparar.outputs.alvo }}
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          if [ "$ALVO" != "dia" ]; then node scripts/kit.mjs; fi
          if [ "$ALVO" = "dia" ] || [ "$ALVO" = "tudo" ] || [ -z "$ALVO" ]; then node scripts/kit.mjs --dia; fi

      # 8) Opcional: envia as pastas para o Google Drive (só se o segredo RCLONE_CONF existir)
      - name: Google Drive
        if: steps.kit.outputs.pasta != '' || steps.kit.outputs.pasta_dia != ''
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "Google Drive não configurado: segredo RCLONE_CONF em falta."; exit 0; fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          PASTA="${{ steps.kit.outputs.pasta }}"; PASTA_DIA="${{ steps.kit.outputs.pasta_dia }}"
          if [ -n "$PASTA" ]; then rclone sync "publicar/$PASTA" "gdrive:Direccoes da Semana/$PASTA" --drive-use-trash=false -v; fi
          if [ -n "$PASTA_DIA" ]; then rclone sync "publicar/dias/$PASTA_DIA" "gdrive:Direccoes da Semana/Posts do dia/$PASTA_DIA" --drive-use-trash=false -v; fi

      - name: Avisar falha
        if: failure()
        run: node scripts/github.mjs falha
