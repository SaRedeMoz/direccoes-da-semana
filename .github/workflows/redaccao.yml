name: Redacção diária

on:
  schedule:
    # 00:00 UTC = 02:00 em Moçambique (CAT, UTC+2). O GitHub pode atrasar alguns minutos.
    - cron: "0 0 * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: redaccao
  cancel-in-progress: false

jobs:
  redaccao:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        (startsWith(github.event.comment.body, '/rever') || startsWith(github.event.comment.body, '/trocar') || startsWith(github.event.comment.body, '/incluir') || startsWith(github.event.comment.body, '/aprovar') || startsWith(github.event.comment.body, 'aprovad')) &&
        github.event.comment.user.login == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.label.name == 'aprovado')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENTO: ${{ github.event_name }}
      COMENTARIO: ${{ github.event.comment.body }}
      COMENTARIO_ID: ${{ github.event.comment.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Configurar git
        run: |
          git config user.name "redaccao-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 1) Sem custo: abre a conversa da semana e junta as suas notícias e sugestões
      - name: Preparar
        id: preparar
        run: node scripts/github.mjs preparar

      # 2) Os agentes — usa a SUA subscrição Claude (sem API paga)
      - name: Agentes (Claude)
        if: steps.preparar.outputs.modo == 'diario' || steps.preparar.outputs.modo == 'rever'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Lê e segue à letra o ficheiro config/instrucoes-agentes.md.
            Modo desta ronda: ${{ steps.preparar.outputs.modo }}.
            Data de hoje (Maputo): ${{ steps.preparar.outputs.hoje }}. Semana: ${{ steps.preparar.outputs.semana }}.
          claude_args: >-
            --max-turns 120
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"

      # 3) Sem custo: junta o trabalho dos agentes na edição
      - name: Montar edição
        if: steps.preparar.outputs.modo == 'diario' || steps.preparar.outputs.modo == 'rever'
        run: node scripts/publicar.mjs

      # 4) Sem custo: gera as imagens dos posts (assinatura S.A REDES no rodapé)
      - name: Imagens dos posts
        if: steps.preparar.outputs.modo != 'aprovar'
        continue-on-error: true
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
          node scripts/imagens.mjs

      # 5) Sem custo: quando aprova a edição, gera o Reel (vídeo 9:16) a partir das stories
      - name: Vídeo (Reel)
        if: steps.preparar.outputs.modo == 'aprovar' || steps.preparar.outputs.modo == 'editar'
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/video.mjs ${{ steps.preparar.outputs.modo == 'editar' && '--se-aprovada' || '' }}

      # 6) Sem custo: envia-lhe o email (comentário na Issue) ou regista a aprovação
      - name: Notificar
        if: success()
        run: node scripts/github.mjs ${{ steps.preparar.outputs.modo == 'aprovar' && 'aprovar' || 'notificar' }}
      # 7) Sem custo: kit de publicação (uma pasta por rede social + ZIP único) da edição aprovada
      - name: Kit da semana
        id: kit
        if: success() && (steps.preparar.outputs.modo == 'aprovar' || steps.preparar.outputs.modo == 'editar')
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/kit.mjs

      # 8) Opcional: envia a pasta da semana para o Google Drive (só se o segredo RCLONE_CONF existir)
      - name: Google Drive
        if: steps.kit.outputs.pasta != ''
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "Google Drive não configurado: segredo RCLONE_CONF em falta."; exit 0; fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone sync "publicar/${{ steps.kit.outputs.pasta }}" "gdrive:Direccoes da Semana/${{ steps.kit.outputs.pasta }}" --drive-use-trash=false -v

      - name: Avisar falha
        if: failure()
        run: node scripts/github.mjs falha
